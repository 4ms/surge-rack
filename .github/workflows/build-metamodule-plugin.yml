name: Build and release MetaModule plugin

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      SDK_branch:
        description: 'MetaModule SDK branch'
        required: true
        type: choice
        default: main
        options:
          - main
      do_release:
        description: 'Create Release (must also select a Tag in "Use workflow from")'
        required: true
        default: false
        type: boolean

jobs:
  build-mm:
    strategy:
      matrix:
        gcc: ['15.3.Rel1']
    name: "Build MetaModule plugin"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ matrix.gcc }}

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'

      - name: Git setup
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build

      - name: Get the SDK
        run: git clone -b ${{ inputs.SDK_branch || 'main' }} https://github.com/4ms/metamodule-plugin-sdk --recursive ${{ github.workspace }}/metamodule-plugin-sdk

      - name: Build
        run: |
          jq -e . metamodule/plugin-mm.json >/dev/null
          mkdir -p ${{ github.workspace }}/metamodule-plugins
          cmake -S metamodule -B metamodule/build -G Ninja -DMETAMODULE_SDK_DIR=${{ github.workspace }}/metamodule-plugin-sdk -DINSTALL_DIR=${{ github.workspace }}/metamodule-plugins
          cmake --build metamodule/build

      - name: Add version to plugin file name
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          cd ${{ github.workspace }}/metamodule-plugins
          for f in *.mmplugin; do mv "$f" "${f%.mmplugin}-${version}.mmplugin"; done
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metamodule-plugin
          path: metamodule-plugins/*.mmplugin

      - name: Release
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.do_release) }}
        uses: softprops/action-gh-release@v2
        with:
          name: "MetaModule Release: ${{ github.ref_name }}"
          files: |
            metamodule-plugins/*.mmplugin
